[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentops-sdk"
version = "0.1.0"
description = "AgentOps Platform SDK — observability, tracing, and evaluation for AI agents"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "AgentOps Platform"}]
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.28.0",
    "pydantic>=2.0.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
langchain = ["langchain>=0.3.0"]
openai = ["openai>=1.0.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "respx>=0.21.0",
]

[project.urls]
Homepage = "https://agentops.io"
Documentation = "https://docs.agentops.io"
Repository = "https://github.com/agentops-platform/sdk"

[tool.hatch.build.targets.wheel]
packages = ["agentops"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
